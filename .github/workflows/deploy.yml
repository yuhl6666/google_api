name: Deploy Insurance Risk Diagnosis Tool

on:
  push:
    branches: [main]
    paths:
      - "insurance-risk-diagnosis/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cloud Functionsは現在デプロイしていない(Blazeプラン=課金が必須なため)。
      # 診断ロジックはweb/src/calcへ移植して同一のテストで検証しており、
      # ここではfunctions/配下の参照実装が壊れていないことだけを継続確認する。
      - name: Build & test reference Cloud Functions implementation
        working-directory: insurance-risk-diagnosis/functions
        run: |
          npm ci
          npm run build
          npm test

      - name: Install, test & build web app
        working-directory: insurance-risk-diagnosis/web
        run: |
          npm ci
          npm test
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Deploy to Firebase (Hosting only — Spark plan, no billing required)
        working-directory: insurance-risk-diagnosis
        run: npx firebase-tools deploy --only hosting --non-interactive
